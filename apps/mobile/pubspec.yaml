name: khata
description: Nepal Digital Khata — Business Management App
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network
  dio: ^5.4.3+1

  # Local database (offline-first)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Routing
  go_router: ^14.1.4

  # Security
  flutter_secure_storage: ^9.2.2

  # Localization
  intl: ^0.20.2

  # Connectivity
  connectivity_plus: ^6.0.3

  # UI
  cached_network_image: ^3.3.1
  fl_chart: ^0.67.0

  # Utils
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  nepali_utils: ^3.0.8

  # Notifications
  flutter_local_notifications: ^17.1.2
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2
  drift_dev: ^2.16.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
